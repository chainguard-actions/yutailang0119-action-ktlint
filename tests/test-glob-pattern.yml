name: Test glob pattern for report-path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with glob pattern matching empty report
        id: action
        uses: .
        with:
          report-path: tests/fixtures/empty-report.xml
          follow-symbolic-links: 'true'
      - name: Assert action succeeded with glob pattern
        run: |
          echo "PASS: action completed successfully using glob pattern for report-path"
