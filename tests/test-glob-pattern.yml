name: Test glob pattern for report path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create multiple clean ktlint reports
        run: |
          mkdir -p /tmp/ktlint-reports/module1
          mkdir -p /tmp/ktlint-reports/module2
          cat > /tmp/ktlint-reports/module1/ktlint-report.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <checkstyle version="8.0">
          </checkstyle>
          EOF
          cat > /tmp/ktlint-reports/module2/ktlint-report.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <checkstyle version="8.0">
          </checkstyle>
          EOF

      - name: Run action with glob pattern matching multiple reports
        id: action
        uses: .
        with:
          report-path: /tmp/ktlint-reports/**/ktlint-report.xml

      - name: Assert action succeeded with glob pattern
        run: |
          echo "Action completed successfully using glob pattern to match multiple reports"
          echo "PASS"
