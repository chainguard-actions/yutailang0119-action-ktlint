name: Test ktlint report with glob pattern matching multiple files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create multiple ktlint XML reports
        run: |
          mkdir -p /tmp/ktlint-multi
          cat > /tmp/ktlint-multi/module1.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <checkstyle version="8.0">
            <file name="src/main/kotlin/com/example/Module1.kt">
              <error line="3" column="1" severity="warning" message="Unnecessary semicolon" source="standard:no-semi"/>
            </file>
          </checkstyle>
          EOF
          cat > /tmp/ktlint-multi/module2.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <checkstyle version="8.0">
          </checkstyle>
          EOF

      - name: Run action with glob pattern covering multiple files
        id: action
        uses: .
        with:
          report-path: /tmp/ktlint-multi/*.xml

      - name: Assert action succeeded (only warnings across all files)
        run: |
          echo "PASS: action processed multiple report files via glob and succeeded"
