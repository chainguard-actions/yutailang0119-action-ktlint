name: Test glob pattern for report-path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up multiple clean report files matching a glob
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build"
          cp "$GITHUB_WORKSPACE/tests/fixtures/empty-report.xml" "$GITHUB_WORKSPACE/build/ktlint-report-1.xml"
          cp "$GITHUB_WORKSPACE/tests/fixtures/empty-report.xml" "$GITHUB_WORKSPACE/build/ktlint-report-2.xml"
      - id: action
        uses: .
        with:
          report-path: 'build/*.xml'
      - name: Assert action succeeded with glob pattern matching multiple clean reports
        run: |
          echo "Action completed successfully with glob pattern"
          echo "PASS: glob pattern correctly matched multiple report files"
