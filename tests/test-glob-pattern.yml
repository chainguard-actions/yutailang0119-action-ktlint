name: Test ktlint report with glob pattern for report-path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create multiple clean ktlint reports
        run: |
          mkdir -p /tmp/ktlint-glob-reports
          cat > /tmp/ktlint-glob-reports/module1-ktlint.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <checkstyle version="8.0">
            <file name="Module1.kt">
              <error line="5" column="1" severity="warning" message="Needless blank line(s)" source="no-consecutive-blank-lines"/>
            </file>
          </checkstyle>
          EOF
          cat > /tmp/ktlint-glob-reports/module2-ktlint.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <checkstyle version="8.0">
            <file name="Module2.kt">
              <error line="8" column="1" severity="warning" message="Wildcard import" source="no-wildcard-imports"/>
            </file>
          </checkstyle>
          EOF

      - id: action
        uses: .
        with:
          report-path: /tmp/ktlint-glob-reports/*.xml
          follow-symbolic-links: 'false'

      - name: Assert action succeeded with glob pattern (warnings only across multiple files)
        run: |
          echo "Action completed successfully using glob pattern to match multiple report files"
          echo "PASS: glob pattern correctly matched multiple report files"
