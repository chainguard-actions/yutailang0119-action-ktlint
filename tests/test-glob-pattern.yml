name: Test ktlint action with glob pattern for report-path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create multiple clean ktlint XML reports
        run: |
          mkdir -p tests/fixtures/build
          cat > tests/fixtures/build/module1-report.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <checkstyle version="8.0">
            <file name="src/main/kotlin/com/example/Module1.kt">
            </file>
          </checkstyle>
          EOF
          cat > tests/fixtures/build/module2-report.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <checkstyle version="8.0">
            <file name="src/main/kotlin/com/example/Module2.kt">
            </file>
          </checkstyle>
          EOF

      - id: action
        uses: .
        with:
          report-path: tests/fixtures/build/*.xml

      - name: Assert action succeeded with glob pattern matching multiple files
        run: |
          echo "Action completed successfully with glob pattern"
          echo "PASS: action correctly processed multiple XML reports via glob pattern"
