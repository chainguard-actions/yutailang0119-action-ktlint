name: Test glob pattern matching multiple reports
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create multiple clean ktlint XML reports
        run: |
          mkdir -p /tmp/ktlint-multi
          cat > /tmp/ktlint-multi/module1.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <checkstyle version="8.0">
            <file name="module1/src/main/kotlin/com/example/Foo.kt">
            </file>
          </checkstyle>
          EOF
          cat > /tmp/ktlint-multi/module2.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <checkstyle version="8.0">
            <file name="module2/src/main/kotlin/com/example/Bar.kt">
            </file>
          </checkstyle>
          EOF

      - id: action
        uses: .
        with:
          report-path: /tmp/ktlint-multi/*.xml

      - name: Assert action succeeded processing multiple reports via glob
        run: |
          echo "Action completed successfully processing multiple reports via glob pattern"
          echo "PASS"
