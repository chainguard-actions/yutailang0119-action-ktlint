name: Test ktlint report-path glob pattern
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create multiple clean ktlint reports
        run: |
          mkdir -p /tmp/ktlint-reports/build
          cat > /tmp/ktlint-reports/build/report1.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <checkstyle version="8.0">
          </checkstyle>
          EOF
          cat > /tmp/ktlint-reports/build/report2.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <checkstyle version="8.0">
          </checkstyle>
          EOF

      - id: action
        name: Run ktlint action with glob pattern
        uses: .
        with:
          report-path: /tmp/ktlint-reports/build/*.xml
          follow-symbolic-links: 'true'
          ignore-warnings: 'false'

      - name: Assert action succeeded with glob pattern
        run: |
          echo "Action completed successfully using glob pattern to match multiple reports"
          echo "PASS"
