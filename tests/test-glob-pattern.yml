name: Test ktlint report with glob pattern matching multiple files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create multiple ktlint checkstyle reports
        run: |
          mkdir -p /tmp/ktlint-reports/module1
          mkdir -p /tmp/ktlint-reports/module2

          cat > /tmp/ktlint-reports/module1/ktlint-report.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <checkstyle version="8.0">
            <file name="module1/src/main/kotlin/com/example/Foo.kt">
            </file>
          </checkstyle>
          EOF

          cat > /tmp/ktlint-reports/module2/ktlint-report.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <checkstyle version="8.0">
            <file name="module2/src/main/kotlin/com/example/Bar.kt">
              <error line="3" column="1" severity="warning" message="No newline at end of file" source="standard:final-newline"/>
            </file>
          </checkstyle>
          EOF

      - id: action
        uses: .
        with:
          report-path: /tmp/ktlint-reports/**/*.xml

      - name: Assert action succeeded with multiple files via glob
        run: |
          echo "Action completed successfully processing multiple report files via glob pattern"
          echo "PASS"
