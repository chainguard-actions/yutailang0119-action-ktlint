name: Test report with warnings only does not fail
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Copy fixture report to workspace
        run: cp "$GITHUB_WORKSPACE/tests/fixtures/warning-report.xml" "$GITHUB_WORKSPACE/ktlint-report.xml"
      - id: action
        uses: .
        with:
          report-path: 'ktlint-report.xml'
          ignore-warnings: 'false'
      - name: Assert action succeeded (warnings do not cause failure)
        run: |
          echo "Action completed successfully with a warnings-only report"
          echo "PASS: warnings alone do not cause the action to fail"
