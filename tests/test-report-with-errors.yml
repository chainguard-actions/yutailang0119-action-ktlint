name: Test ktlint report with errors
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create ktlint checkstyle report with errors
        run: |
          mkdir -p /tmp/ktlint-reports
          cat > /tmp/ktlint-reports/report-errors.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <checkstyle version="8.0">
            <file name="src/main/kotlin/com/example/Main.kt">
              <error line="1" column="1" severity="error" message="Unexpected blank line(s) before &quot;}&quot;" source="standard:no-blank-line-before-rbrace"/>
              <error line="5" column="10" severity="error" message="Missing newline before &quot;{&quot;" source="standard:brace-style"/>
            </file>
          </checkstyle>
          EOF

      - name: Run action with error report (expect failure)
        id: action
        uses: .
        with:
          report-path: /tmp/ktlint-reports/report-errors.xml
          ignore-warnings: 'false'
        continue-on-error: true

      - name: Assert action failed due to errors
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when report contains errors, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when report contained errors"
