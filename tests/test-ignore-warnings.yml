name: Test ignore warnings
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create ktlint report with warnings only
        run: |
          mkdir -p /tmp/ktlint-reports
          cat > /tmp/ktlint-reports/report.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <checkstyle version="8.0">
            <file name="Foo.kt">
              <error line="22" column="1" severity="warning" message="Needless blank line(s)" source="no-consecutive-blank-lines"/>
            </file>
            <file name="Bar.kts">
              <error line="45" column="1" severity="warning" message="Needless blank line(s)" source="no-consecutive-blank-lines"/>
            </file>
          </checkstyle>
          EOF

      - name: Run action with warnings-only report and ignore-warnings enabled
        id: action
        uses: .
        with:
          report-path: /tmp/ktlint-reports/report.xml
          ignore-warnings: 'true'

      - name: Assert action succeeded when warnings are ignored
        run: |
          echo "Action completed successfully — warnings were ignored"
          echo "PASS"
