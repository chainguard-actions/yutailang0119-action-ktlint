name: Test ktlint ignore-warnings flag
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create ktlint report with warnings only
        run: |
          mkdir -p /tmp/ktlint-reports
          cat > /tmp/ktlint-reports/ktlint-report.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <checkstyle version="8.0">
            <file name="Foo.kt">
              <error line="22" column="1" severity="warning" message="Needless blank line(s)" source="no-consecutive-blank-lines"/>
            </file>
          </checkstyle>
          EOF

      - id: action
        name: Run ktlint action with ignore-warnings enabled
        uses: .
        with:
          report-path: /tmp/ktlint-reports/ktlint-report.xml
          follow-symbolic-links: 'true'
          ignore-warnings: 'true'

      - name: Assert action succeeded with ignore-warnings
        run: |
          echo "Action completed successfully - warnings were ignored"
          echo "PASS"
