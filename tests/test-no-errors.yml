name: Test no errors (clean report)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with empty report (no lint issues)
        id: action
        uses: .
        with:
          report-path: tests/fixtures/empty-report.xml
      - name: Assert action succeeded
        run: |
          echo "PASS: action completed successfully with no errors"
