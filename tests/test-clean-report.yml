name: Test clean report (no errors)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Copy fixture report to workspace
        run: cp "$GITHUB_WORKSPACE/tests/fixtures/empty-report.xml" "$GITHUB_WORKSPACE/ktlint-report.xml"
      - id: action
        uses: .
        with:
          report-path: 'ktlint-report.xml'
      - name: Assert action succeeded (no errors in clean report)
        run: |
          echo "Action completed successfully with a clean report"
          echo "PASS"
