name: Test report with errors causes failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Copy fixture report to workspace
        run: cp "$GITHUB_WORKSPACE/tests/fixtures/error-report.xml" "$GITHUB_WORKSPACE/ktlint-report.xml"
      - id: action
        uses: .
        with:
          report-path: 'ktlint-report.xml'
        continue-on-error: true
      - name: Assert action failed due to errors
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when report contains errors, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when report contains errors"
