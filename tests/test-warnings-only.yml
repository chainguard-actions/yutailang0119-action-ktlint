name: Test ktlint report with warnings only
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create ktlint XML report with warnings only
        run: |
          mkdir -p /tmp/ktlint-reports
          cat > /tmp/ktlint-reports/report-warnings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <checkstyle version="8.0">
            <file name="src/main/kotlin/com/example/Main.kt">
              <error line="10" column="1" severity="warning" message="Unnecessary semicolon" source="standard:no-semi"/>
              <error line="20" column="5" severity="warning" message="Missing newline before closing brace" source="standard:no-empty-class-body"/>
            </file>
          </checkstyle>
          EOF

      - name: Run action with warnings-only report
        id: action
        uses: .
        with:
          report-path: /tmp/ktlint-reports/report-warnings.xml

      - name: Assert action succeeded (warnings do not cause failure)
        run: |
          echo "PASS: action completed without failure — warnings are non-fatal"
