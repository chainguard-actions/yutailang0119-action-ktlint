name: Test ktlint report with warnings only
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create ktlint report with warnings only
        run: |
          mkdir -p /tmp/ktlint-reports
          cat > /tmp/ktlint-reports/report.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <checkstyle version="8.0">
            <file name="src/main/kotlin/com/example/Main.kt">
              <error line="5" column="1" severity="warning" message="Wildcard import" source="standard:no-wildcard-imports"/>
              <error line="10" column="3" severity="warning" message="Missing newline before closing brace" source="standard:newline-before-closing-brace"/>
            </file>
          </checkstyle>
          EOF

      - id: action
        uses: .
        with:
          report-path: /tmp/ktlint-reports/report.xml
          ignore-warnings: 'false'

      - name: Assert action succeeded with warnings-only report
        run: |
          echo "Action completed successfully - warnings do not fail the action"
          echo "PASS"
